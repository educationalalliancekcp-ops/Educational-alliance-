<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Alliance | Admission</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 15px; }
        .container { max-width: 600px; margin: 20px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h2 { color: #1e3c72; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #1e3c72; padding-bottom: 10px; font-size: 1.6rem; }
        .choice-container { display: flex; gap: 12px; margin-bottom: 20px; }
        .choice-btn { flex: 1; padding: 12px; border: 2px solid #ccc; border-radius: 6px; cursor: pointer; text-align: center; font-weight: bold; background: #fafafa; transition: 0.3s; font-size: 0.95rem; }
        .choice-btn:hover { border-color: #1e3c72; background: #eef2f7; }
        .choice-btn.active { border-color: #1e3c72; background: #1e3c72; color: white; }
        .form-section { display: none; }
        .form-section.show { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.95rem; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #1e3c72; }
        .btn-submit { background: #1e3c72; color: white; border: none; padding: 12px 20px; font-size: 1.1rem; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        .btn-submit:hover { background: #162d56; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-whatsapp:hover { background: #1ebd52; }
        .status-msg { margin-top: 15px; padding: 12px; border-radius: 4px; display: none; text-align: center; font-weight: bold; font-size: 0.95rem; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎯 ভর্তি আবেদন প্যানেল</h2>
    
    <label style="text-align: center; display: block; margin-bottom: 10px; color: #555;">আবেদনের মাধ্যম বেছে নিন:</label>
    <div class="choice-container">
        <div class="choice-btn active" id="btn-choice-online" onclick="switchMethod('online')">🌐 অনলাইনে আবেদন</div>
        <div class="choice-btn" id="btn-choice-wa" onclick="switchMethod('whatsapp')">💬 WhatsApp আবেদন</div>
    </div>

    <div id="online-form-section" class="form-section show">
        <form id="onlineForm">
            <div class="form-group"><label for="name">शिक्षার্থীর নাম *</label><input type="text" id="name" name="name" required placeholder="নাম লিখুন"></div>
            <div class="form-group"><label for="student_phone">শিক্ষার্থীর মোবাইল *</label><input type="tel" id="student_phone" name="student_phone" required placeholder="০১৭XXXXXXXX"></div>
            <div class="form-group"><label for="guardian_phone">অভিভাবকের মোবাইল *</label><input type="tel" id="guardian_phone" name="guardian_phone" required placeholder="০১৭XXXXXXXX"></div>
            <div class="form-group">
                <label for="class_name">শ্রেণি *</label>
                <select id="class_name" name="class_name" required>
                    <option value="">নির্বাচন করুন</option>
                    <option value="৬ষ্ঠ">৬ষ্ঠ</option><option value="৭ম">৭ম</option><option value="৮ম">৮ম</option>
                    <option value="৯ম">৯ম</option><option value="১০ম">১০ম</option><option value="১১শ">১১শ</option><option value="১২ম">১২ম</option>
                </select>
            </div>
            <div class="form-group"><label for="subject">বিষয় *</label><input type="text" id="subject" name="subject" required placeholder="উদা: সকল বিষয় বা নির্দিষ্ট বিষয়"></div>
            <div class="form-group">
                <label for="blood">রক্তের গ্রুপ</label>
                <select id="blood" name="blood">
                    <option value="">নির্বাচন করুন</option>
                    <option value="A+">A+</option><option value="A-">A−</option><option value="B+">B+</option><option value="B-">B−</option>
                    <option value="O+">O+</option><option value="O-">O−</option><option value="AB+">AB+</option><option value="AB-">AB−</option>
                </select>
            </div>
            <div class="form-group">
                <label for="gender">লিঙ্গ</label>
                <select id="gender" name="gender">
                    <option value="">নির্বাচন করুন</option>
                    <option value="ছেলে">ছেলে</option><option value="মেয়ে">মেয়ে</option>
                </select>
            </div>
            <div class="form-group"><label for="address">ঠিকানা *</label><textarea id="address" name="address" rows="2" required placeholder="আপনার বর্তমান ঠিকানা"></textarea></div>
            <div class="form-group"><label for="school">স্কুল/কলেজের নাম *</label><input type="text" id="school" name="school" required placeholder="শিক্ষা প্রতিষ্ঠানের নাম"></div>
            <button type="submit" class="btn-submit">✅ চূড়ান্তভাবে জমা দিন</button>
        </form>
        <div id="status" class="status-msg"></div>
    </div>

    <div id="wa-form-section" class="form-section">
        <form id="waForm">
            <div class="form-group"><label for="wa_name">শিক্ষার্থীর নাম *</label><input type="text" id="wa_name" required placeholder="নাম লিখুন"></div>
            <div class="form-group"><label for="wa_phone">মোবাইল নম্বর *</label><input type="tel" id="wa_phone" required placeholder="০১৭XXXXXXXX"></div>
            <div class="form-group"><label for="wa_class">শ্রেণি *</label><input type="text" id="wa_class" required placeholder="যেমন: ১০ম"></div>
            <button type="submit" class="btn-submit btn-whatsapp">💬 হোয়াটসঅ্যাপে পাঠান</button>
        </form>
    </div>
</div>

<script>
    function switchMethod(method) {
        document.getElementById('btn-choice-online').classList.remove('active');
        document.getElementById('btn-choice-wa').classList.remove('active');
        document.getElementById('online-form-section').classList.remove('show');
        document.getElementById('wa-form-section').classList.remove('show');
        if(method === 'online') {
            document.getElementById('btn-choice-online').classList.add('active');
            document.getElementById('online-form-section').classList.add('show');
        } else {
            document.getElementById('btn-choice-wa').classList.add('active');
            document.getElementById('wa-form-section').classList.add('show');
        }
    }

    document.getElementById('waForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('wa_name').value;
        const phone = document.getElementById('wa_phone').value;
        const className = document.getElementById('wa_class').value;
        const myWhatsAppNumber = "8801400034888";
        const text = `*নতুন ভর্তি আবেদন (WhatsApp)*%0A----------------------%0A📝 নাম: ${name}%0A📱 মোবাইল: ${phone}%0A🏫 শ্রেণি: ${className}`;
        window.open(`https://whatsapp.com{myWhatsAppNumber}&text=${text}`, '_blank');
    });

    document.getElementById('onlineForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = "block";
        statusDiv.className = "status-msg";
        statusDiv.innerText = "আবেদন প্রসেস করা হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...";

        const scriptURL = 'https://google.com'; 

        const formData = new FormData();
        formData.append('name', document.getElementById('name').value);
        formData.append('student_phone', document.getElementById('student_phone').value);
        formData.append('guardian_phone', document.getElementById('guardian_phone').value);
        formData.append('class_name', document.getElementById('class_name').value);
        formData.append('subject', document.getElementById('subject').value);
        formData.append('blood', document.getElementById('blood').value);
        formData.append('gender', document.getElementById('gender').value);
        formData.append('address', document.getElementById('address').value);
        formData.append('school', document.getElementById('school').value);
        formData.append('method', 'Online');

        fetch(scriptURL, { method: 'POST', body: formData })
        .then(response => {
            statusDiv.classList.add('success');
            statusDiv.innerText = "✅ আপনার আবেদনটি সফলভাবে জমা হয়েছে!";
            document.getElementById('onlineForm').reset();
        })
        .catch(error => {
            statusDiv.classList.add('error');
            statusDiv.innerText = "❌ আবেদন জমা দেওয়া যায়নি। নেটওয়ার্ক চেক করে আবার চেষ্টা করুন।";
            console.error('Error!', error.message);
        });
    });
</script>
</body>
          </html>
